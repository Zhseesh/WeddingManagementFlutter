name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test
        continue-on-error: true

      # ---- Decode Keystore: sanitasi whitespace + verifikasi magic byte ----
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          CLEAN_B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$CLEAN_B64" ]; then
            echo "ERROR: secret KEYSTORE_BASE64 kosong."
            exit 1
          fi
          printf '%s' "$CLEAN_B64" | openssl base64 -d -A > android/app/keystore.jks
          SIZE=$(stat -c%s android/app/keystore.jks)
          echo "keystore.jks size = $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: keystore.jks terlalu kecil, decode gagal."
            exit 1
          fi
          MAGIC=$(head -c 4 android/app/keystore.jks | xxd -p)
          echo "keystore magic = $MAGIC (harus: feedfeed)"
          if [ "$MAGIC" != "feedfeed" ]; then
            echo "ERROR: file bukan JKS valid. Periksa secret KEYSTORE_BASE64."
            exit 1
          fi

      - name: Create key.properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Split APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-split
          path: build/app/outputs/flutter-apk/*.apk