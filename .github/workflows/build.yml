name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Wajib untuk upload ke GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test
        continue-on-error: true

      # ---------------------------------------------------------------
      # Langkah di bawah memerlukan secrets; di-skip untuk PR dari fork
      # (fork tidak punya akses secrets repo asal).
      # ---------------------------------------------------------------
      - name: Decode Keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          CLEAN_B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ -z "$CLEAN_B64" ]; then
            echo "ERROR: secret KEYSTORE_BASE64 kosong."
            exit 1
          fi
          printf '%s' "$CLEAN_B64" | openssl base64 -d -A > android/app/keystore.jks
          SIZE=$(stat -c%s android/app/keystore.jks)
          echo "keystore.jks size = $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: keystore.jks terlalu kecil, decode gagal."
            exit 1
          fi
          MAGIC=$(head -c 4 android/app/keystore.jks | xxd -p)
          echo "keystore magic = $MAGIC"
          if [[ "$MAGIC" == feedfeed* ]]; then
            echo "Keystore format: JKS"
          elif [[ "$MAGIC" == 30* ]]; then
            echo "Keystore format: PKCS12"
          else
            echo "ERROR: file bukan JKS/PKCS12 valid. Periksa secret KEYSTORE_BASE64."
            exit 1
          fi

      - name: Create key.properties
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Split APK (per ABI)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: flutter build apk --release

      - name: Prepare release artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          SUFFIX="${GITHUB_REF_NAME:-dev}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "release-artifacts/wedding-armeabi-v7a-${SUFFIX}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "release-artifacts/wedding-arm64-v8a-${SUFFIX}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             "release-artifacts/wedding-x86_64-${SUFFIX}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/wedding-universal-${SUFFIX}.apk"
          ls -la release-artifacts/

      - name: Upload APK artifacts (workflow)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: release-artifacts/*.apk
          retention-days: 30

      # ---------------------------------------------------------------
      # Publish ke GitHub Release — hanya saat push tag v* (mis. v1.0.0)
      # ---------------------------------------------------------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}