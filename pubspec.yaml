name: weddingmanagementf
description: "Wedding Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.2
  path: ^1.9.0
  intl: ^0.19.0
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  share_plus: ^10.1.0
  path_provider: ^2.1.5
  file_picker: ^8.1.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  fl_chart: ^0.69.0       

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21